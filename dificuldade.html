<!DOCTYPE html>  
<html lang="pt-BR">  
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drummond Secure - Quiz</title>
    <link rel="icon" href="photos/1.ico" type="image/x-icon">
    <link rel="shortcut icon" href="photos/1.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>  
<body>  
    <header class="cabecalho">  
        <div class="container">  
            <div class="logo">  
                <div class="icone-seguranca">  
                    <div class="hexagon"></div>  
                    <i class="fas fa-shield-alt"></i>  
                </div>  
                <h1>Drummond Secure</h1>  
            </div>  
            <nav class="navegacao">  
                <ul class="menu">  
                    <li><a href="index.html" class="menu-link">HOME</a></li>  
                    <li><a href="conteudo.html" class="menu-link">CONTEÚDO</a></li>  
                    <li><a href="dificuldade.html" class="menu-link ativo">QUIZ</a></li>  
                </ul>  
            </nav>  
        </div>  
    </header>  

    <main class="conteudo-principal">  
        <section class="escolha-dificuldade">  
            <div class="titulo-container">  
                <h2 class="titulo-tech">Escolha o Nível de Desafio</h2>  
                <div class="barra-gradiente"></div>  
            </div>  
            
            <div class="grades-dificuldade">  
                <button class="botao-dificuldade" data-dificuldade="facil">  
                    <div class="icone-hover">⭐</div>  
                    <h3>Fácil</h3>  
                    <p>Perfeito para iniciantes</p>  
                </button>  

                <button class="botao-dificuldade" data-dificuldade="medio">  
                    <div class="icone-hover">🔥</div>  
                    <h3>Médio</h3>  
                    <p>Para quem já conhece o básico</p>  
                </button>  

                <button class="botao-dificuldade" data-dificuldade="dificil">  
                    <div class="icone-hover">💀</div>  
                    <h3>Difícil</h3>  
                    <p>Desafio para especialistas</p>  
                </button>  
            </div>  
        </section>  
    </main>  

    <script>  
        document.querySelectorAll('.botao-dificuldade').forEach(botao => {  
            botao.addEventListener('click', () => {  
                const dificuldade = botao.dataset.dificuldade;  
                window.location.href = `quiz.html?dificuldade=${dificuldade}`;  
            });  
        });  
    </script>  
</body>  
</html>
