<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drummond Secure - Quiz</title>
    <link rel="icon" href="photos/1.ico" type="image/x-icon">
    <link rel="shortcut icon" href="photos/1.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body>
    <header class="cabecalho">
        <div class="container">
            <div class="logo">
                <div class="icone-seguranca">
                    <div class="hexagon"></div>
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>Drummond Secure</h1>
            </div>
            <nav class="navegacao">
                <ul class="menu">
                    <li><a href="index.html" class="menu-link">HOME</a></li>
                    <li><a href="conteudo.html" class="menu-link">CONTEÚDO</a></li>  
                    <li><a href="dificuldade.html" class="menu-link ativo">QUIZ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="conteudo-principal">
        <section class="quiz-container">
            <div class="cabecalho-quiz">
                <h2 id="categoriaAtual">Carregando quiz...</h2>
                <div class="barra-progresso">
                    <div id="progresso"></div>
                </div>
                <span id="contador">0/0</span>
            </div>

            <div id="perguntaContainer" class="pergunta">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Carregando perguntas...</p>
                </div>
            </div>

            <div class="feedback" id="feedback"></div>

            <button id="proximaPergunta" class="escondido">
                Próxima <i class="fas fa-arrow-right"></i>
            </button>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
